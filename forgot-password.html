<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.min.css">
    <link rel="stylesheet" href="assets/css/pill-alerts.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #fdfbf7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;}
        .card {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border-radius: 35px; padding: 60px 50px; max-width: 480px; width: 90%; text-align: center;
        }
        .icon-circle {
            width: 80px; height: 80px; border-radius: 50%; background: rgba(245,158,11,0.1);
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; color: #f59e0b; margin: 0 auto 30px;
        }
        h1 { font-size: 1.9rem; font-weight: 800; color: #1a1a1a; margin-bottom: 15px; }
        p { color: #666; line-height: 1.7; margin-bottom: 30px; font-size: 1.05rem; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 0.9rem; color: #374151; }
        .form-control { width: 100%; padding: 16px 24px; border-radius: 20px; border: 2px solid #f3f4f6; background: #f9fafb; font-size: 1rem; outline: none; box-sizing: border-box; font-family: inherit; }
        .form-control:focus { border-color: #10b981; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 35px; width: 100%;
            background: #10b981; color: white; border: none; border-radius: 50px; font-weight: 800;
            font-size: 1rem; text-decoration: none; transition: 0.3s; cursor: pointer;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(16,185,129,0.25); }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .back-link:hover { color: #10b981; }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">
            <i class="ph-fill ph-lock-key-open"></i>
        </div>
        <h1>Forgot Password?</h1>
        <p>Enter your registered email address and we will send you a link to reset your password.</p>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="john@example.com">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Send Reset Link</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>
        <a href="login.html" class="back-link">
            <i class="ph ph-arrow-left" style="margin-right: 5px;"></i> Back to Login
        </a>
    </div>

    <script type="module">
        import { resetPasswordRequest } from './js/auth.js';

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';

            await resetPasswordRequest(email);

            submitBtn.disabled = false;
            btnText.style.display = 'block';
            btnSpinner.style.display = 'none';
        });
    </script>
</body>
</html>
