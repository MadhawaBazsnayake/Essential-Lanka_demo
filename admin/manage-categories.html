<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .admin-section { padding: 50px 5%; min-height: 85vh; position: relative; }
        .admin-container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; }
        
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #666; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.05rem; }
        .back-btn:hover { color: #10b981; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; }

        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; align-items: start; animation: fadeUp 0.6s ease forwards;}

        .glass-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0,0,0,0.06); padding: 35px; border-radius: 35px; }
        .glass-box h3 { font-size: 1.4rem; font-weight: 800; color: #1a1a1a; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; color: #1a1a1a; }
        .form-control { width: 100%; padding: 15px 20px; border-radius: 15px; border: 2px solid #e5dfd5; background: #ffffff; font-size: 1rem; transition: 0.3s; outline: none; font-weight: 500; font-family: inherit; }
        .form-control:focus { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
        
        .btn-submit { background: #10b981; color: white; padding: 15px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; width: 100%; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(16,185,129,0.2); display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(16,185,129,0.3); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .category-card { background: #ffffff; border: 1.5px solid #f0ebe1; padding: 25px; border-radius: 20px; text-align: center; transition: 0.3s; display: flex; flex-direction: column; align-items: center; position: relative; }
        .category-card:hover { border-color: #10b981; box-shadow: 0 15px 35px rgba(16,185,129,0.1); transform: translateY(-5px); }
        
        .cat-icon { width: 70px; height: 70px; background: rgba(16, 185, 129, 0.1); color: #10b981; border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 2.2rem; margin-bottom: 15px; transition: 0.3s; }
        .category-card:hover .cat-icon { background: #10b981; color: white; }
        
        .cat-title { font-size: 1.15rem; font-weight: 800; color: #1a1a1a; margin-bottom: 5px; }
        .cat-meta { font-size: 0.85rem; color: #a3a3a3; font-weight: 600; margin-bottom: 20px; }

        .cat-actions { display: flex; gap: 10px; width: 100%; border-top: 1.5px solid #f0ebe1; padding-top: 15px; margin-top: auto;}
        .btn-action { flex: 1; border: 2px solid #e5dfd5; background: transparent; color: #1a1a1a; padding: 8px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; }
        .btn-action:hover { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.05); }
        .btn-action.delete:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.05); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            .admin-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .header-action { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

<section class="admin-section bg-cream">
    <div class="mesh-bg"></div>
    
    <div class="admin-container">
        
        <div class="header-action fade-up show">
            <h1 class="page-title">Manage Categories</h1>
            <a href="dashboard.html" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="admin-grid">
            
            <div class="glass-box glass-premium fade-up show" style="transition-delay: 100ms;">
                <h3><i class="ph-fill ph-plus-circle" style="color: #10b981;"></i> Add New Category</h3>
                
                <form id="addCategoryForm">
                    <div class="form-group">
                        <label>Category Name</label>
                        <input type="text" id="catName" class="form-control" placeholder="E.g. Electrical, Plumbing" required>
                    </div>

                    <div class="form-group">
                        <label>Icon Class (Phosphor Icons)</label>
                        <input type="text" id="catIcon" class="form-control" placeholder="E.g. ph-lightning, ph-drop" required>
                    </div>

                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <textarea id="catDesc" class="form-control" placeholder="Short description about this service..." style="resize: vertical; min-height: 100px;"></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="addBtn">
                        <i class="ph-bold ph-floppy-disk"></i> Save Category
                    </button>
                </form>
            </div>

            <div class="glass-box glass-premium fade-up show" style="transition-delay: 200ms;">
                <h3 style="margin-bottom: 25px;"><i class="ph-fill ph-squares-four" style="color: #3b82f6;"></i> Existing Categories</h3>
                
                <div class="category-grid" id="categoriesContainer">
                    <p style="color: #64748b; grid-column: 1 / -1; text-align: center; padding: 40px;">Loading categories...</p>
                </div>
            </div>

        </div>
    </div>
</section>

<script type="module">
    import { supabase } from '../js/supabase-client.js';

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: profile } = await supabase.from('users').select('role').eq('auth_id', session.user.id).single();
        if (!profile || profile.role !== 'admin') { window.location.href = '../login.html'; return; }

        await loadCategories();

        document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="ph-bold ph-spinner-gap" style="animation:spin 1s linear infinite;"></i> Saving...';

            const payload = {
                name_en: document.getElementById('catName').value,
                icon_class: document.getElementById('catIcon').value,
                description: document.getElementById('catDesc').value
            };

            const { error } = await supabase.from('categories').insert([payload]);

            btn.disabled = false;
            btn.innerHTML = '<i class="ph-bold ph-floppy-disk"></i> Save Category';

            if (error) {
                Swal.fire('Error', 'Failed to add category.', 'error');
            } else {
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Category added!', showConfirmButton: false, timer: 3000 });
                document.getElementById('addCategoryForm').reset();
                loadCategories();
            }
        });
    });

    async function loadCategories() {
        const { data: categories, error } = await supabase.from('categories').select('*').order('id', { ascending: true });
        
        // Count workers per category
        const { data: profiles } = await supabase.from('worker_profiles').select('category_id');

        const counts = {};
        if (profiles) {
            profiles.forEach(p => {
                if (p.category_id) {
                    counts[p.category_id] = (counts[p.category_id] || 0) + 1;
                }
            });
        }

        const container = document.getElementById('categoriesContainer');
        if (error || !categories || categories.length === 0) {
            container.innerHTML = '<p style="color: #64748b; grid-column: 1 / -1; text-align: center; padding: 40px;">No categories found.</p>';
            return;
        }

        let html = '';
        categories.forEach(cat => {
            const catTitle = cat.name_en || cat.name || 'Category';
            const catIcon = cat.icon_class || cat.icon || 'ph-squares-four';
            const activeWorkers = counts[cat.id] || 0;

            html += `
                <div class="category-card" id="cat-${cat.id}">
                    <div class="cat-icon"><i class="ph-fill ${catIcon}"></i></div>
                    <h4 class="cat-title">${catTitle}</h4>
                    <span class="cat-meta">${activeWorkers.toLocaleString()} Active Workers</span>
                    
                    <div class="cat-actions">
                        <button class="btn-action delete" title="Delete Category" onclick="window.deleteCategory(${cat.id})"><i class="ph-bold ph-trash"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.deleteCategory = function(catId) {
        Swal.fire({
            title: "Are you sure?",
            text: "This will delete the category. This may affect workers using this category.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#EF4444",
            cancelButtonColor: "#6B7280",
            confirmButtonText: "Yes, delete it!"
        }).then(async (result) => {
            if (result.isConfirmed) {
                const { error } = await supabase.from('categories').delete().eq('id', catId);
                if (error) {
                    Swal.fire('Error', 'Failed to delete category.', 'error');
                } else {
                    const card = document.getElementById('cat-' + catId);
                    if (card) {
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.95)';
                        setTimeout(() => card.remove(), 300);
                    }
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Category deleted!', showConfirmButton: false, timer: 3000 });
                }
            }
        });
    };
</script>

</body>
</html>
