<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Reports - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .admin-section { padding: 50px 5%; min-height: 85vh; position: relative; }
        .admin-container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; }
        
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #666; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.05rem; }
        .back-btn:hover { color: #10b981; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 35px rgba(0,0,0,0.04); padding: 30px; border-radius: 30px; display: flex; align-items: center; gap: 20px; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        
        .stat-icon { width: 60px; height: 60px; border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 2rem; }
        
        .stat-info p { font-size: 0.9rem; color: #666; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-info h3 { font-size: 1.8rem; font-weight: 800; color: #1a1a1a; }

        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }

        .glass-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0,0,0,0.06); padding: 35px; border-radius: 35px; animation: fadeUp 0.5s ease forwards; }
        .glass-box h3 { font-size: 1.4rem; font-weight: 800; color: #1a1a1a; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; color: #1a1a1a; }
        .form-control { width: 100%; padding: 15px 20px; border-radius: 15px; border: 2px solid #e5dfd5; background: #ffffff; font-size: 1rem; transition: 0.3s; outline: none; font-weight: 500; font-family: inherit; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
        
        select.form-control { appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%231a1a1a" viewBox="0 0 256 256"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>'); background-repeat: no-repeat; background-position: right 20px center; }

        .btn-submit { background: #3b82f6; color: white; padding: 15px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; width: 100%; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(59,130,246,0.2); display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(59,130,246,0.3); background: #2563eb; }
        
        .btn-export { background: #1a1a1a; color: white; padding: 10px 20px; border-radius: 50px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; border: none; cursor: pointer; font-family: inherit; }
        .btn-export:hover { background: #000000; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }

        .table-responsive { overflow-x: auto; margin-top: 20px; }
        .report-table { width: 100%; border-collapse: collapse; min-width: 500px; }
        .report-table th { text-align: left; padding: 15px; background: #f8fafc; color: #64748b; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e2e8f0; }
        .report-table td { padding: 18px 15px; border-bottom: 1px solid #f0ebe1; font-size: 1rem; color: #1a1a1a; font-weight: 500; }
        .report-table tr:hover td { background: #f8fafc; }
        
        .status-success { color: #10b981; font-weight: 700; background: rgba(16,185,129,0.1); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            .admin-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<section class="admin-section bg-cream">
    <div class="mesh-bg"></div>
    
    <div class="admin-container">
        
        <div class="header-action fade-up show">
            <h1 class="page-title">System Reports</h1>
            <a href="dashboard.html" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="stats-grid fade-up show" style="transition-delay: 50ms;">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;"><i class="ph-fill ph-money"></i></div>
                <div class="stat-info">
                    <p>Total Revenue</p>
                    <h3 id="statTotalRev">Rs. 0</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;"><i class="ph-fill ph-chart-line-up"></i></div>
                <div class="stat-info">
                    <p>Platform Fees (10%)</p>
                    <h3 id="statFees">Rs. 0</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(139, 92, 246, 0.1); color: #8b5cf6;"><i class="ph-fill ph-handshake"></i></div>
                <div class="stat-info">
                    <p>Total Completed Jobs</p>
                    <h3 id="statJobs">0</h3>
                </div>
            </div>
        </div>

        <div class="admin-grid">
            
            <div class="glass-box glass-premium fade-up show" style="transition-delay: 100ms;">
                <h3><i class="ph-fill ph-funnel" style="color: #3b82f6;"></i> Generate Report</h3>
                
                <form id="filterForm">
                    <div class="form-group">
                        <label>Report Type</label>
                        <select class="form-control" id="reportType">
                            <option value="financial">Financial Transactions</option>
                            <option value="jobs">Completed Jobs</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>

                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn-submit" style="flex: 1;">
                            <i class="ph-bold ph-funnel"></i> Apply Filter
                        </button>
                        <button type="button" class="btn-export" onclick="window.resetFilters()" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">Reset</button>
                    </div>
                </form>
            </div>

            <div class="glass-box glass-premium fade-up show" style="transition-delay: 200ms;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                    <h3 style="margin: 0;" id="tableTitle"><i class="ph-fill ph-table" style="color: #1a1a1a;"></i> Recent Transactions</h3>
                    
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-export" onclick="window.exportData('csv')"><i class="ph-bold ph-file-csv"></i> CSV</button>
                        <button class="btn-export" onclick="window.exportData('pdf')"><i class="ph-bold ph-printer"></i> Print / PDF</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="report-table" id="reportTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Job ID</th>
                                <th>Title</th>
                                <th>Client</th>
                                <th>Amount (Rs.)</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr><td colspan="6" style="text-align:center; color:#64748b; padding:20px;">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</section>

<script type="module">
    import { supabase } from '../js/supabase-client.js';

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: profile } = await supabase.from('users').select('role').eq('auth_id', session.user.id).single();
        if (!profile || profile.role !== 'admin') { window.location.href = '../login.html'; return; }

        await fetchReports();

        document.getElementById('filterForm').addEventListener('submit', (e) => {
            e.preventDefault();
            fetchReports();
        });
    });

    async function fetchReports() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const isFiltered = startDate || endDate;

        document.getElementById('tableTitle').innerHTML = `<i class="ph-fill ph-table" style="color: #1a1a1a;"></i> ${isFiltered ? 'Filtered Transactions' : 'Recent Transactions'}`;

        let query = supabase.from('jobs').select(`
            id, title, created_at, budget,
            client:users!jobs_client_id_fkey(first_name, last_name)
        `).eq('status', 'completed');

        if (startDate) {
            query = query.gte('created_at', startDate + 'T00:00:00Z');
        }
        if (endDate) {
            query = query.lte('created_at', endDate + 'T23:59:59Z');
        }

        query = query.order('created_at', { ascending: false }).limit(50);

        const { data: jobs, error } = await query;

        if (error) {
            Swal.fire('Error', 'Failed to load reports', 'error');
            return;
        }

        // Calculate stats
        let totalRevenue = 0;
        let totalJobsCount = jobs ? jobs.length : 0;

        if (jobs) {
            jobs.forEach(j => {
                totalRevenue += j.budget ? parseFloat(j.budget) : 0;
            });
        }

        document.getElementById('statTotalRev').innerText = 'Rs. ' + totalRevenue.toLocaleString(undefined, {minimumFractionDigits:2});
        document.getElementById('statFees').innerText = 'Rs. ' + (totalRevenue * 0.10).toLocaleString(undefined, {minimumFractionDigits:2});
        document.getElementById('statJobs').innerText = totalJobsCount.toLocaleString();

        const tbody = document.getElementById('reportTableBody');
        
        if (!jobs || jobs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b; padding:20px;">No completed jobs found for the selected period.</td></tr>';
            return;
        }

        let html = '';
        jobs.forEach(j => {
            const dt = new Date(j.created_at).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
            const clientName = j.client ? `${j.client.first_name} ${j.client.last_name || ''}` : 'Unknown';
            const amount = j.budget ? parseFloat(j.budget).toLocaleString(undefined, {minimumFractionDigits:2}) : '0.00';
            
            html += `
                <tr>
                    <td>${dt}</td>
                    <td>#${j.id}</td>
                    <td>${j.title}</td>
                    <td>${clientName}</td>
                    <td>Rs. ${amount}</td>
                    <td><span class="status-success">Completed</span></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    window.resetFilters = function() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        fetchReports();
    };

    window.exportData = function(type) {
        if (type === 'pdf') {
            window.print();
            return;
        }

        // CSV Export
        const table = document.getElementById('reportTable');
        let csv = [];
        for (let row of table.rows) {
            let cols = Array.from(row.cells).map(cell => '"' + cell.innerText.replace(/"/g, '""') + '"');
            csv.push(cols.join(","));
        }
        const csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
        const downloadLink = document.createElement("a");
        downloadLink.download = "system_report_" + new Date().toISOString().slice(0,10) + ".csv";
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();
    };
</script>

</body>
</html>
