<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --dark: #111827;
            --gray: #F3F4F6;
            --text-main: #374151;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 5px solid var(--primary);
        }
        .stat-card i { font-size: 32px; color: var(--primary); }
        .stat-info h4 { margin: 0; font-size: 14px; color: #6B7280; text-transform: uppercase; }
        .stat-info h2 { margin: 5px 0 0; font-size: 24px; color: var(--dark); font-weight: 800; }
        
        .filter-bar {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            outline: none;
            flex: 1;
            min-width: 150px;
            font-family: inherit;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: #4338CA; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); color: #000; }
        
        .table-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #E5E7EB;
        }
        th { background: #F9FAFB; font-weight: 600; color: #4B5563; }
        tr:hover { background: #F3F4F6; }
        
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.active { background: #D1FAE5; color: #065F46; }
        .badge.suspended { background: #FEE2E2; color: #991B1B; }
        .badge.role { background: #E0E7FF; color: #3730A3; text-transform: capitalize; }
        
        .action-btns button { padding: 6px 12px; font-size: 13px; margin-right: 5px; }

        .pagination { display:flex; justify-content:space-between; align-items:center; margin-top:20px; flex-wrap:wrap; gap:10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin: 0;"><i class="ph ph-users-three"></i> Advanced User Management</h2>
        <a href="dashboard.html" class="btn btn-primary"><i class="ph ph-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- Stats Row -->
    <div class="stats-grid">
        <div class="stat-card">
            <i class="ph-fill ph-users"></i>
            <div class="stat-info"><h4>Total Users</h4><h2 id="statTotalUsers">0</h2></div>
        </div>
        <div class="stat-card" style="border-color: var(--success);">
            <i class="ph-fill ph-briefcase"></i>
            <div class="stat-info"><h4>Total Workers</h4><h2 id="statTotalWorkers">0</h2></div>
        </div>
        <div class="stat-card" style="border-color: var(--warning);">
            <i class="ph-fill ph-shopping-cart"></i>
            <div class="stat-info"><h4>Total Clients</h4><h2 id="statTotalClients">0</h2></div>
        </div>
        <div class="stat-card" style="border-color: var(--danger);">
            <i class="ph-fill ph-warning-circle"></i>
            <div class="stat-info"><h4>Suspended Accounts</h4><h2 id="statSuspended">0</h2></div>
        </div>
    </div>

    <!-- Search & Filters -->
    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search Name or Phone...">
        <select id="roleFilter">
            <option value="">All Roles</option>
            <option value="client">Client</option>
            <option value="worker">Worker</option>
            <option value="admin">Admin</option>
        </select>
        <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="true">Active</option>
            <option value="false">Suspended</option>
        </select>
        <button type="button" class="btn btn-primary" onclick="window.applyFilters()"><i class="ph ph-magnifying-glass"></i> Filter</button>
        <button type="button" class="btn btn-warning" onclick="window.resetFilters()"><i class="ph ph-arrows-clockwise"></i> Reset</button>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Joined Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="7" style="text-align:center; padding:30px;">Loading users...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls">
        <span style="color:#64748b; font-size:0.9rem;" id="pageInfo">Showing 0 - 0 of 0 users</span>
        <div style="display:flex; gap:6px;">
            <button class="btn" style="background:#e2e8f0; color:#1e293b;" id="prevBtn" onclick="window.prevPage()"><i class="ph ph-caret-left"></i> Prev</button>
            <span style="display:inline-flex; align-items:center; padding:0 12px; font-weight:700; color:#1e293b;" id="pageIndicator">Page 1</span>
            <button class="btn btn-primary" id="nextBtn" onclick="window.nextPage()">Next <i class="ph ph-caret-right"></i></button>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../js/supabase-client.js';

    let allUsers = [];
    let filteredUsers = [];
    let currentPage = 1;
    const perPage = 25;

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: profile } = await supabase.from('users').select('role').eq('auth_id', session.user.id).single();
        if (!profile || profile.role !== 'admin') { window.location.href = '../login.html'; return; }

        await fetchUsers();

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('roleFilter').addEventListener('change', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);
    });

    async function fetchUsers() {
        const { data, error } = await supabase.from('users').select('*').order('created_at', { ascending: false });
        if (error) {
            Swal.fire('Error', 'Failed to load users', 'error');
            return;
        }
        allUsers = data || [];
        updateStats();
        applyFilters();
    }

    function updateStats() {
        let total = allUsers.length;
        let workers = 0, clients = 0, suspended = 0;
        
        allUsers.forEach(u => {
            if (u.role === 'worker') workers++;
            else if (u.role === 'client') clients++;
            
            if (u.is_active === false) suspended++;
        });

        document.getElementById('statTotalUsers').innerText = total.toLocaleString();
        document.getElementById('statTotalWorkers').innerText = workers.toLocaleString();
        document.getElementById('statTotalClients').innerText = clients.toLocaleString();
        document.getElementById('statSuspended').innerText = suspended.toLocaleString();
    }

    window.applyFilters = function() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const role = document.getElementById('roleFilter').value;
        const status = document.getElementById('statusFilter').value;

        filteredUsers = allUsers.filter(u => {
            let matchSearch = true;
            if (search) {
                const name = `${u.first_name || ''} ${u.last_name || ''}`.toLowerCase();
                const phone = u.phone ? u.phone.toLowerCase() : '';
                matchSearch = name.includes(search) || phone.includes(search);
            }
            
            let matchRole = role ? u.role === role : true;
            let matchStatus = true;
            if (status === 'true') matchStatus = u.is_active !== false;
            else if (status === 'false') matchStatus = u.is_active === false;

            return matchSearch && matchRole && matchStatus;
        });

        currentPage = 1;
        renderTable();
    };

    window.resetFilters = function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('roleFilter').value = '';
        document.getElementById('statusFilter').value = '';
        applyFilters();
    };

    function renderTable() {
        const tbody = document.getElementById('usersTableBody');
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageUsers = filteredUsers.slice(start, end);

        if (pageUsers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;">No users found matching your criteria.</td></tr>';
        } else {
            let html = '';
            pageUsers.forEach(u => {
                const dt = new Date(u.created_at).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
                const isActive = u.is_active !== false;
                const statusBadge = isActive 
                    ? '<span class="badge active"><i class="ph ph-check-circle"></i> Active</span>'
                    : '<span class="badge suspended"><i class="ph ph-prohibit"></i> Suspended</span>';
                
                const toggleBtn = isActive
                    ? `<button class="btn btn-warning" onclick="window.toggleStatus(${u.id}, false)"><i class="ph ph-pause"></i> Suspend</button>`
                    : `<button class="btn btn-success" onclick="window.toggleStatus(${u.id}, true)"><i class="ph ph-play"></i> Activate</button>`;

                html += `
                    <tr>
                        <td>#${u.id}</td>
                        <td><strong>${u.first_name} ${u.last_name || ''}</strong></td>
                        <td>${u.phone || 'N/A'}</td>
                        <td><span class="badge role">${u.role}</span></td>
                        <td>${statusBadge}</td>
                        <td>${dt}</td>
                        <td class="action-btns">
                            ${toggleBtn}
                            <button class="btn btn-danger" onclick="window.confirmDelete(${u.id})"><i class="ph ph-trash"></i> Delete</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // Pagination controls
        const total = filteredUsers.length;
        const totalPages = Math.ceil(total / perPage) || 1;
        
        document.getElementById('pageInfo').innerText = `Showing ${total === 0 ? 0 : start + 1} - ${Math.min(end, total)} of ${total.toLocaleString()} users`;
        document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
        
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage === totalPages;
    }

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            renderTable();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(filteredUsers.length / perPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderTable();
        }
    };

    window.toggleStatus = async function(id, newStatus) {
        const { error } = await supabase.from('users').update({ is_active: newStatus }).eq('id', id);
        if (error) {
            Swal.fire('Error', `Failed to update user status: ${error.message}`, 'error');
        } else {
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Status updated!', showConfirmButton: false, timer: 3000 });
            // Update local state and re-render
            const u = allUsers.find(user => user.id === id);
            if (u) u.is_active = newStatus;
            updateStats();
            applyFilters();
        }
    };

    window.confirmDelete = function(id) {
        Swal.fire({
            title: "Are you sure?",
            text: "This action cannot be undone. All data related to this user will be deleted!",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#EF4444",
            cancelButtonColor: "#6B7280",
            confirmButtonText: "Yes, delete it!"
        }).then(async (result) => {
            if (result.isConfirmed) {
                const { error } = await supabase.from('users').delete().eq('id', id);
                if (error) {
                    Swal.fire('Error', 'Failed to delete user.', 'error');
                } else {
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'User deleted!', showConfirmButton: false, timer: 3000 });
                    allUsers = allUsers.filter(u => u.id !== id);
                    updateStats();
                    applyFilters();
                }
            }
        });
    };
</script>

</body>
</html>
