<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .page-section { padding: 50px 5%; min-height: 85vh; position: relative; }
        .page-container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; }
        
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; flex-wrap: wrap; gap: 20px; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #666; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.05rem; margin-bottom: 10px; display: block; }
        .back-btn:hover { color: #10b981; }

        .btn-create { background: #1a1a1a; color: white; padding: 14px 25px; border-radius: 50px; font-weight: 800; text-decoration: none; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); cursor: pointer; border: none; font-size: 1rem;}
        .btn-create:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.25); background: #000000; }

        .glass-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0,0,0,0.06); padding: 40px; border-radius: 35px; animation: fadeUp 0.5s ease forwards; }

        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        .portfolio-card { background: #ffffff; border: 1.5px solid #f0ebe1; border-radius: 25px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; }
        .portfolio-card:hover { border-color: #10b981; box-shadow: 0 15px 40px rgba(16,185,129,0.12); transform: translateY(-5px); }
        
        .portfolio-img { width: 100%; height: 220px; background-size: cover; background-position: center; position: relative; background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; font-size: 3rem; color: #94a3b8; }
        .portfolio-badge { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); color: #1a1a1a; padding: 6px 12px; border-radius: 50px; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .portfolio-content { padding: 25px; display: flex; flex-direction: column; flex: 1; }
        .portfolio-title { font-size: 1.25rem; font-weight: 800; color: #1a1a1a; margin-bottom: 8px; }
        
        .portfolio-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0ebe1; padding-top: 15px; margin-top: auto; }
        .date-text { font-size: 0.85rem; color: #a3a3a3; font-weight: 600; }
        
        .action-group { display: flex; gap: 10px; }
        .btn-icon { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #e5dfd5; background: #ffffff; color: #1a1a1a; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-icon:hover { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.05); }
        .btn-icon.delete:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.05); }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 4rem; color: #d1d5db; margin-bottom: 20px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-box { background: white; padding: 35px; border-radius: 25px; max-width: 500px; width: 90%; transform: translateY(30px); transition: 0.4s; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        
        .form-control { width: 100%; padding: 12px 18px; border-radius: 12px; border: 2px solid #e2e8f0; background: #f8fafc; font-size: 0.95rem; transition: 0.3s; outline: none; margin-bottom: 20px; }
        .form-control:focus { border-color: #10b981; background: #ffffff; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .header-action { flex-direction: column; align-items: flex-start; gap: 15px; }
            .portfolio-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header id="site-header"></header>

<section class="page-section bg-cream">
    <div class="mesh-bg"></div>
    <div class="page-container">
        
        <a href="dashboard.html" class="back-btn fade-up show"><i class="ph-bold ph-arrow-left"></i> Back to Dashboard</a>
        
        <div class="header-action fade-up show" style="transition-delay: 50ms;">
            <h1 class="page-title">My Portfolio</h1>
            <button class="btn-create" onclick="window.addProject()"><i class="ph-bold ph-upload-simple"></i> Upload Project</button>
        </div>

        <div class="glass-box glass-premium fade-up show" style="transition-delay: 100ms;">
            <div class="portfolio-grid" id="portfolioContainer">
                <!-- Data loaded via JS -->
                <div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px;">Loading portfolio...</div>
            </div>
        </div>
    </div>
</section>

<!-- Upload Modal -->
<div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
        <h3 style="margin-bottom:20px; font-weight:800; font-size: 1.5rem; color: #1a1a1a;">Upload New Project</h3>
        <form id="portfolioForm">
            <label style="display:block; font-weight:700; margin-bottom:8px; font-size: 0.95rem;">Project Title</label>
            <input type="text" class="form-control" id="projTitle" required placeholder="e.g. Modern Kitchen Plumbing">
            
            <label style="display:block; font-weight:700; margin-bottom:8px; font-size: 0.95rem;">Project Image (Optional Placeholder)</label>
            <input type="file" id="projImg" accept="image/*" class="form-control" style="padding: 10px;">
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: -15px; margin-bottom: 20px;">*Image uploads are mocked for now.</p>
            
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button type="button" onclick="window.closeModal()" style="padding:12px 25px; border-radius:50px; border:2px solid #e2e8f0; background:transparent; font-weight:700; cursor:pointer; color:#64748b;">Cancel</button>
                <button type="submit" style="padding:12px 25px; border-radius:50px; border:none; background:#10b981; color:white; font-weight:800; cursor:pointer; box-shadow: 0 10px 20px rgba(16,185,129,0.2);">Upload</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { loadLayout } from '../js/layout.js';
    import { supabase } from '../js/supabase-client.js';

    let currentUserId = null;

    window.addProject = function() {
        const m = document.getElementById('uploadModal');
        m.classList.add('active');
    };
    window.closeModal = function() {
        const m = document.getElementById('uploadModal');
        m.classList.remove('active');
        document.getElementById('portfolioForm').reset();
    };

    document.addEventListener('DOMContentLoaded', async () => {
        loadLayout();

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: profile } = await supabase.from('users').select('id, role').eq('auth_id', session.user.id).single();
        if (!profile || profile.role !== 'worker') { window.location.href = '../login.html'; return; }
        currentUserId = profile.id;

        await loadPortfolios();

        document.getElementById('portfolioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('projTitle').value;
            // Since we don't have storage configured, use a placeholder image path
            const dummyImagePath = 'assets/images/placeholder.jpg';

            const { error } = await supabase.from('portfolios').insert([{
                worker_id: currentUserId,
                title: title,
                image_path: dummyImagePath
            }]);

            if (error) {
                Swal.fire('Error', 'Could not upload portfolio item.', 'error');
            } else {
                Swal.fire('Success', 'Project uploaded successfully!', 'success').then(() => {
                    window.closeModal();
                    loadPortfolios();
                });
            }
        });
    });

    async function loadPortfolios() {
        const { data: portfolios, error } = await supabase.from('portfolios').select('*').eq('worker_id', currentUserId).order('created_at', { ascending: false });
        
        const container = document.getElementById('portfolioContainer');
        
        let html = '';
        if (portfolios && portfolios.length > 0) {
            portfolios.forEach(proj => {
                const dt = new Date(proj.created_at).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
                
                // Show actual image if exists, else a placeholder icon box
                const bgHtml = proj.image_path && proj.image_path !== 'assets/images/placeholder.jpg' 
                    ? `style="background-image: url('../${proj.image_path}');"` 
                    : '';
                const iconHtml = !bgHtml ? `<i class="ph-bold ph-image"></i>` : '';

                html += `
                    <div class="portfolio-card" id="proj-${proj.id}">
                        <div class="portfolio-img" ${bgHtml}>
                            ${iconHtml}
                            <div class="portfolio-badge"><i class="ph-fill ph-camera"></i> Project Photo</div>
                        </div>
                        <div class="portfolio-content">
                            <h3 class="portfolio-title">${proj.title}</h3>
                            <div class="portfolio-actions">
                                <span class="date-text">Added ${dt}</span>
                                <div class="action-group">
                                    <button class="btn-icon delete" title="Delete" onclick="window.deleteProject(${proj.id})"><i class="ph-bold ph-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        // Add "Add New" placeholder card
        html += `
            <div class="portfolio-card" style="border: 2px dashed #cbd5e1; background: transparent; cursor: pointer; justify-content: center; align-items: center; min-height: 350px;" onclick="window.addProject()">
                <div class="empty-state">
                    <i class="ph-bold ph-plus-circle empty-icon" style="color: #10b981;"></i>
                    <h3 style="font-size: 1.2rem; font-weight: 700; color: #1a1a1a; margin-bottom: 5px;">Add New Project</h3>
                    <p style="color: #666; font-size: 0.9rem;">Showcase your best work to attract more customers.</p>
                </div>
            </div>
        `;

        container.innerHTML = html;
    }

    window.deleteProject = async function(id) {
        if(!confirm('Are you sure you want to delete this project?')) return;

        const { error } = await supabase.from('portfolios').delete().eq('id', id);
        if (error) {
            Swal.fire('Error', 'Failed to delete project.', 'error');
        } else {
            const card = document.getElementById('proj-' + id);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => card.remove(), 300);
            }
        }
    };
</script>
</body>
</html>
