<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Essential Lanka</title>
    <meta name="theme-color" content="#10b981">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.min.css">
    <link rel="stylesheet" href="assets/css/pill-alerts.css">
    <style>
        body { background: #fdfbf7; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .chat-container { display: flex; flex: 1; overflow: hidden; max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px; gap: 20px; }
        
        /* Sidebar (Contacts) */
        .chat-sidebar { width: 350px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid #f0ebe1; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { font-size: 1.5rem; font-weight: 800; color: #1a1a1a; margin: 0; }
        .back-btn { display: flex; align-items: center; gap: 5px; color: #64748b; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .back-btn:hover { color: #10b981; }
        
        .contacts-list { flex: 1; overflow-y: auto; padding: 15px; }
        .contact-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 15px; cursor: pointer; transition: 0.3s; margin-bottom: 5px; }
        .contact-item:hover { background: #f8fafc; }
        .contact-item.active { background: #ecfdf5; border: 1px solid #a7f3d0; }
        .contact-avatar { width: 50px; height: 50px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #94a3b8; flex-shrink: 0; object-fit: cover; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: 700; color: #1e293b; font-size: 1.05rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-role { font-size: 0.8rem; color: #64748b; }
        
        /* Main Chat Window */
        .chat-main { flex: 1; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .chat-header { padding: 20px 25px; border-bottom: 1px solid #f0ebe1; display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.5); }
        .chat-header .contact-avatar { width: 45px; height: 45px; }
        .chat-header h3 { margin: 0; font-size: 1.2rem; font-weight: 800; color: #1a1a1a; }
        
        .messages-container { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; background: #fdfbf7; }
        
        .message-bubble { max-width: 70%; padding: 12px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.5; position: relative; clear: both; }
        .message-bubble.sent { background: #10b981; color: white; border-bottom-right-radius: 5px; align-self: flex-end; }
        .message-bubble.received { background: #ffffff; color: #1e293b; border-bottom-left-radius: 5px; align-self: flex-start; border: 1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .message-time { font-size: 0.7rem; margin-top: 5px; opacity: 0.7; text-align: right; }
        .message-bubble.received .message-time { text-align: left; color: #94a3b8; }
        
        .chat-input-area { padding: 20px 25px; background: white; border-top: 1px solid #f0ebe1; display: flex; align-items: center; gap: 15px; }
        .chat-input { flex: 1; border: 2px solid #e2e8f0; border-radius: 50px; padding: 12px 20px; font-size: 1rem; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif; }
        .chat-input:focus { border-color: #10b981; }
        .btn-send { width: 45px; height: 45px; border-radius: 50%; background: #10b981; color: white; border: none; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .btn-send:hover { background: #059669; transform: scale(1.05); }
        .btn-send:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94a3b8; }
        .empty-state i { font-size: 4rem; margin-bottom: 15px; color: #cbd5e1; }
        .empty-state h3 { font-size: 1.5rem; font-weight: 700; color: #475569; margin-bottom: 5px; }

        @media (max-width: 900px) {
            .chat-container { padding: 10px; gap: 10px; }
            .chat-sidebar { width: 300px; }
        }
        @media (max-width: 768px) {
            .chat-container { flex-direction: column; }
            .chat-sidebar { width: 100%; flex: 1; max-height: 40vh; }
            .chat-main { flex: 2; }
        }
    </style>
</head>
<body>

<header id="site-header"></header>

<div class="chat-container">
    
    <!-- Sidebar -->
    <div class="chat-sidebar">
        <div class="sidebar-header">
            <h2>Messages</h2>
            <a href="#" id="dashboardLink" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Dashboard</a>
        </div>
        <div class="contacts-list" id="contactsList">
            <div style="text-align: center; padding: 30px; color: #94a3b8;">
                <i class="ph-duotone ph-spinner-gap ph-spin" style="font-size: 2rem;"></i>
                <p>Loading contacts...</p>
            </div>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-main">
        
        <div id="emptyState" class="empty-state">
            <i class="ph-duotone ph-chat-circle-dots"></i>
            <h3>Your Messages</h3>
            <p>Select a conversation from the sidebar to start chatting.</p>
        </div>

        <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <div class="contact-avatar"><i class="ph-fill ph-user"></i></div>
                <div>
                    <h3 id="chatHeaderName">User Name</h3>
                    <div style="font-size: 0.8rem; color: #10b981; font-weight: 600;"><i class="ph-fill ph-circle"></i> Online</div>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <!-- Messages will be appended here -->
            </div>
            
            <form class="chat-input-area" id="messageForm">
                <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="btn-send" id="sendBtn"><i class="ph-bold ph-paper-plane-right"></i></button>
            </form>
        </div>

    </div>

</div>

<script type="module">
    import { loadLayout } from './js/layout.js';
    import { supabase } from './js/supabase-client.js';
    import { loadContacts, loadMessages, sendMessage, subscribeToMessages } from './js/chat.js';

    let currentUserId = null;
    let activeContactId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const headerRes = await fetch('components/header.html');
        if(headerRes.ok) document.getElementById('site-header').innerHTML = await headerRes.text();

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        
        const { data: userProfile } = await supabase.from('users').select('*').eq('auth_id', session.user.id).single();
        if (!userProfile) return;
        currentUserId = userProfile.id;

        // Set Dashboard Link
        const dashLink = document.getElementById('dashboardLink');
        if(userProfile.role === 'admin') dashLink.href = 'admin/dashboard.html';
        else if(userProfile.role === 'worker') dashLink.href = 'worker/dashboard.html';
        else if(userProfile.role === 'tool_provider') dashLink.href = 'tool_provider/dashboard.html';
        else dashLink.href = 'client/dashboard.html';

        // Load Contacts
        await initContacts();

        // Subscriptions
        subscribeToMessages(currentUserId, (payload) => {
            if(payload.eventType === 'INSERT') {
                const msg = payload.new;
                // If it's for the currently open chat
                if((msg.sender_id === activeContactId && msg.receiver_id === currentUserId) || 
                   (msg.sender_id === currentUserId && msg.receiver_id === activeContactId)) {
                    appendMessage(msg);
                }
                // Also refresh contacts to show new order
                initContacts();
            }
        });

        // Form Submit
        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text || !activeContactId) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            input.disabled = true;

            const success = await sendMessage(currentUserId, activeContactId, text);
            if(success) {
                input.value = '';
                // Message will be appended by Realtime listener, but we can optimistically append here too
                // For simplicity, let's rely on Realtime listener.
            }

            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        });
    });

    async function initContacts() {
        const contacts = await loadContacts(currentUserId);
        const container = document.getElementById('contactsList');
        
        if(!contacts || contacts.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding: 20px; color: #94a3b8;">No conversations yet.</div>';
            return;
        }

        container.innerHTML = '';
        contacts.forEach(contact => {
            const div = document.createElement('div');
            div.className = `contact-item ${contact.id === activeContactId ? 'active' : ''}`;
            div.onclick = () => openChat(contact);
            
            div.innerHTML = `
                <div class="contact-avatar"><i class="ph-fill ph-user"></i></div>
                <div class="contact-info">
                    <div class="contact-name">${contact.first_name} ${contact.last_name}</div>
                    <div class="contact-role">${contact.role.replace('_', ' ').toUpperCase()}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.openChat = async function(contact) {
        activeContactId = contact.id;
        
        // Update UI
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('activeChat').style.display = 'flex';
        document.getElementById('chatHeaderName').innerText = `${contact.first_name} ${contact.last_name}`;
        
        // Refresh contacts list to set active class
        const items = document.querySelectorAll('.contact-item');
        items.forEach(item => item.classList.remove('active'));
        // Lazy way to find the clicked one, but fine for now.

        // Load Messages
        const msgContainer = document.getElementById('messagesContainer');
        msgContainer.innerHTML = '<div style="text-align:center; color: #94a3b8; margin: auto;"><i class="ph-duotone ph-spinner-gap ph-spin" style="font-size: 2rem;"></i></div>';
        
        const messages = await loadMessages(currentUserId, activeContactId);
        msgContainer.innerHTML = '';

        if(messages && messages.length > 0) {
            messages.forEach(msg => appendMessage(msg));
        } else {
            msgContainer.innerHTML = '<div style="text-align:center; color: #94a3b8; margin: auto; font-size: 0.9rem;">Start the conversation!</div>';
        }
    };

    function appendMessage(msg) {
        const msgContainer = document.getElementById('messagesContainer');
        const emptyText = msgContainer.querySelector('div');
        if(emptyText && emptyText.innerText === 'Start the conversation!') {
            msgContainer.innerHTML = '';
        }

        const isSent = msg.sender_id === currentUserId;
        const div = document.createElement('div');
        div.className = `message-bubble ${isSent ? 'sent' : 'received'}`;
        
        const timeStr = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        div.innerHTML = `
            ${msg.message || msg.message_text || ''}
            <div class="message-time">${timeStr}</div>
        `;
        msgContainer.appendChild(div);
        
        // Scroll to bottom
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }
</script>

</body>
</html>
