<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .page-section { padding: 50px 5%; min-height: 85vh; position: relative; }
        .page-container { max-width: 800px; margin: 0 auto; position: relative; z-index: 10; }
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #666; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.05rem; }
        .back-btn:hover { color: #10b981; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; }
        .glass-box { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0,0,0,0.06); padding: 40px; border-radius: 35px; animation: fadeUp 0.5s ease forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; color: #1e293b; }
        .form-control { width: 100%; padding: 14px 20px; border-radius: 16px; border: 2px solid #e2e8f0; background: #f8fafc; font-size: 1rem; transition: 0.3s; outline: none; font-family: inherit; }
        .form-control:focus { border-color: #10b981; background: #ffffff; box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
        .d-flex-gap { display: flex; gap: 20px; }
        .d-flex-gap .form-group { flex: 1; }
        .btn-submit { background: #10b981; color: white; padding: 16px 35px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1.05rem; box-shadow: 0 10px 25px rgba(16,185,129,0.25); display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(16,185,129,0.35); background: #059669; }
        @media (max-width: 768px) {
            .d-flex-gap { flex-direction: column; gap: 0; }
            .glass-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<header id="site-header"></header>

<section class="page-section bg-cream">
    <div class="mesh-bg"></div>
    <div class="page-container">
        <div class="header-action fade-up show">
            <h1 class="page-title"><i class="ph-fill ph-user-gear" style="color: #10b981;"></i> Edit Profile</h1>
            <a href="dashboard.html" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="glass-box">
            <form id="profileForm">
                <div class="d-flex-gap">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" disabled style="background:#e2e8f0; cursor:not-allowed;">
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="07XXXXXXXX">
                </div>

                <button type="submit" class="btn-submit" id="saveBtn">
                    <i class="ph-bold ph-floppy-disk"></i> Save Profile Details
                </button>
            </form>

            <hr style="border: 0; border-top: 1.5px dashed #e2e8f0; margin: 40px 0;">

            <h3 style="font-size: 1.3rem; font-weight: 800; color: #1e293b; margin-bottom: 20px;">Change Password</h3>
            <form id="passwordForm">
                <div class="d-flex-gap">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="updatePwdBtn" style="background:#1e293b;">
                    <i class="ph-bold ph-lock-key"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</section>

<footer id="site-footer"></footer>

<script type="module">
    import { loadLayout } from '../js/layout.js';
    import { supabase } from '../js/supabase-client.js';

    let currentUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        loadLayout();

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: profile } = await supabase.from('users').select('*').eq('auth_id', session.user.id).single();
        if (!profile || profile.role !== 'client') { window.location.href = '../login.html'; return; }

        currentUserId = profile.id;

        document.getElementById('firstName').value = profile.first_name || '';
        document.getElementById('lastName').value = profile.last_name || '';
        document.getElementById('phone').value = profile.phone || '';
        document.getElementById('email').value = session.user.email || '';

        // Save Profile Form
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const ogText = btn.innerHTML;
            btn.innerHTML = 'Saving...'; btn.disabled = true;

            const updates = {
                first_name: document.getElementById('firstName').value.trim(),
                last_name: document.getElementById('lastName').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };

            const { error } = await supabase.from('users').update(updates).eq('id', currentUserId);

            btn.innerHTML = ogText; btn.disabled = false;

            if (error) {
                Swal.fire('Error', error.message || 'Failed to update profile.', 'error');
            } else {
                await Swal.fire({ icon: 'success', title: 'Saved!', text: 'Your profile has been updated.', confirmButtonColor: '#10b981' });
                window.location.href = 'dashboard.html';
            }
        });

        // Change Password Form
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                Swal.fire('Warning', 'Passwords do not match.', 'warning');
                return;
            }

            const btn = document.getElementById('updatePwdBtn');
            btn.innerHTML = 'Updating...'; btn.disabled = true;

            const { error } = await supabase.auth.updateUser({ password: p1 });

            btn.innerHTML = '<i class="ph-bold ph-lock-key"></i> Update Password'; btn.disabled = false;

            if (error) {
                Swal.fire('Error', error.message, 'error');
            } else {
                Swal.fire({ icon: 'success', title: 'Password Changed!', text: 'Your password has been changed successfully.', confirmButtonColor: '#10b981' });
                document.getElementById('passwordForm').reset();
            }
        });
    });
</script>
</body>
</html>
