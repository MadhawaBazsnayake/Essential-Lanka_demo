<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Jobs - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .page-section { padding: 50px 5%; min-height: 85vh; position: relative; }
        .page-container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 10; }
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #666; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.05rem; }
        .back-btn:hover { color: #10b981; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; }
        .glass-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0,0,0,0.06); padding: 40px; border-radius: 35px; }
        .job-card { background: #ffffff; border: 1.5px solid #f0ebe1; padding: 25px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; transition: 0.3s; flex-wrap: wrap; gap: 20px; animation: fadeUp 0.5s ease forwards; }
        .job-card:hover { border-color: #10b981; box-shadow: 0 12px 35px rgba(16,185,129,0.1); transform: translateY(-3px); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .job-info { display: flex; align-items: center; gap: 20px; }
        .worker-avatar { width: 65px; height: 65px; border-radius: 50%; background-color: #e5dfd5; display: flex; justify-content: center; align-items: center; color: #a3a3a3; font-size: 2rem; border: 3px solid #ffffff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); overflow: hidden;}
        .worker-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .badge-active { background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 6px 14px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 8px; }
        .badge-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; padding: 6px 14px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 8px; }
        .action-group { display: flex; gap: 12px; }
        .btn-outline { border: 2px solid #e5dfd5; background: transparent; color: #1a1a1a; padding: 12px 20px; border-radius: 50px; font-weight: 700; text-decoration: none; transition: 0.3s; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-outline:hover:not(:disabled) { border-color: #ef4444; color: #ef4444; }
        .btn-outline:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary-sm { background: #10b981; color: white; padding: 12px 25px; border-radius: 50px; font-weight: 700; text-decoration: none; transition: 0.3s; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(16,185,129,0.2); display: flex; align-items: center; gap: 8px; }
        .btn-primary-sm:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(16,185,129,0.3); }
        .loading-state { text-align: center; padding: 40px; color: #64748b; }
        @media (max-width: 768px) {
            .job-card { flex-direction: column; align-items: flex-start; padding: 20px; }
            .action-group { width: 100%; flex-direction: column; }
            .btn-outline, .btn-primary-sm { width: 100%; justify-content: center; }
            .header-action { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

<header id="site-header"></header>

<section class="page-section bg-cream">
    <div class="mesh-bg"></div>
    <div class="page-container">
        <div class="header-action fade-up show">
            <h1 class="page-title">Active Jobs</h1>
            <a href="dashboard.html" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Back to Dashboard</a>
        </div>
        <div class="glass-box glass-premium fade-up show" style="transition-delay: 100ms;" id="jobsContainer">
            <div class="loading-state"><i class="ph-bold ph-spinner-gap" style="animation: spin 1s linear infinite; font-size: 2rem;"></i><p>Loading active jobs...</p></div>
        </div>
    </div>
</section>

<footer id="site-footer"></footer>

<script type="module">
    import { loadLayout } from '../js/layout.js';
    import { supabase } from '../js/supabase-client.js';

    document.addEventListener('DOMContentLoaded', async () => {
        loadLayout();

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: profile } = await supabase.from('users').select('id, role').eq('auth_id', session.user.id).single();
        if (!profile || profile.role !== 'client') { window.location.href = '../login.html'; return; }

        const userId = profile.id;

        // Fetch active jobs
        const { data: activeJobs, error } = await supabase.from('jobs')
            .select(`
                *,
                worker:users!jobs_assigned_worker_id_fkey(first_name, last_name, phone, profile_pic)
            `)
            .eq('client_id', userId)
            .in('status', ['open', 'in_progress'])
            .order('created_at', { ascending: false });

        const container = document.getElementById('jobsContainer');

        if (error) {
            console.error(error);
            container.innerHTML = `<div style="text-align:center; color:#ef4444;">Failed to load active jobs.</div>`;
            return;
        }

        if (!activeJobs || activeJobs.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; padding: 40px; color:#64748b;">
                    <i class="ph-fill ph-clock-counter-clockwise" style="font-size: 3rem; margin-bottom: 10px; color:#cbd5e1;"></i>
                    <p>You have no active or pending requests at the moment.</p>
                </div>
            `;
            return;
        }

        let html = '';
        activeJobs.forEach(job => {
            const isInProgress = job.status === 'in_progress';
            const statusLabel = isInProgress ? 'In Progress' : 'Waiting for Bids';
            const badgeClass = isInProgress ? 'badge-active' : 'badge-pending';
            const icon = isInProgress ? 'ph-circle-notch' : 'ph-hourglass-high';
            const spin = isInProgress ? 'style="animation: spin 2s linear infinite;"' : '';
            
            const workerName = job.worker ? `${job.worker.first_name} ${job.worker.last_name}` : '';
            const workerPic = job.worker && job.worker.profile_pic ? `<img src="../${job.worker.profile_pic}" alt="Worker">` : `<i class="ph-fill ph-user"></i>`;
            
            let actionHtml = '';
            let metaHtml = '';

            if (isInProgress) {
                metaHtml = `<p style="font-size: 0.95rem; color: #666;"><i class="ph-fill ph-user"></i> ${workerName} • <i class="ph-fill ph-map-pin"></i> GPS: ${job.location_lat},${job.location_lng}</p>`;
                actionHtml = `<a href="payments.html?job_id=${job.id}" class="btn-primary-sm"><i class="ph-bold ph-check-circle"></i> Complete & Pay</a>`;
            } else {
                metaHtml = `<p style="font-size: 0.95rem; color: #666;">Requested on ${new Date(job.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</p>`;
                actionHtml = `<button class="btn-outline" style="color: #ef4444; border-color: #ef4444;" onclick="window.cancelJob(${job.id})"><i class="ph-bold ph-x-circle"></i> Cancel</button>`;
            }

            html += `
                <div class="job-card" id="job-card-${job.id}">
                    <div class="job-info">
                        <div class="worker-avatar">
                            ${workerPic}
                        </div>
                        <div>
                            <span class="${badgeClass}"><i class="ph-fill ${icon}" ${spin}></i> ${statusLabel}</span>
                            <h3 style="font-size: 1.2rem; font-weight: 800; color: #1a1a1a; margin-bottom: 4px;">${job.title}</h3>
                            ${metaHtml}
                        </div>
                    </div>
                    <div class="action-group">
                        ${actionHtml}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        // Attach cancel function to window for the onclick handler
        window.cancelJob = async function(jobId) {
            const result = await Swal.fire({
                title: 'Cancel Job Request?',
                text: 'Are you sure you want to cancel this job request? This cannot be undone.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Yes, Cancel Job'
            });

            if (result.isConfirmed) {
                const { error } = await supabase.from('jobs').update({ status: 'cancelled' }).eq('id', jobId);
                if (error) {
                    console.error(error);
                    Swal.fire('Error', 'Could not cancel job.', 'error');
                } else {
                    Swal.fire('Cancelled!', 'Your job request has been cancelled.', 'success');
                    document.getElementById(`job-card-${jobId}`).remove();
                    if(document.querySelectorAll('.job-card').length === 0) {
                        document.getElementById('jobsContainer').innerHTML = `
                            <div style="text-align:center; padding: 40px; color:#64748b;">
                                <i class="ph-fill ph-clock-counter-clockwise" style="font-size: 3rem; margin-bottom: 10px; color:#cbd5e1;"></i>
                                <p>You have no active or pending requests at the moment.</p>
                            </div>
                        `;
                    }
                }
            }
        };
    });
</script>
<style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
