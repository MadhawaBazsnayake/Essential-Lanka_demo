<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .profile-section { padding: 40px 5%; min-height: 85vh; background: #f8fafc; }
        .profile-container { max-width: 1000px; margin: 0 auto; animation: fadeUp 0.5s ease forwards; }
        
        .profile-header { background: #ffffff; border-radius: 25px; padding: 40px; border: 1.5px solid #e2e8f0; display: flex; gap: 30px; align-items: center; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        .profile-avatar { width: 130px; height: 130px; border-radius: 50%; background: #e2e8f0; display: flex; justify-content: center; align-items: center; font-size: 3rem; color: #64748b; font-weight: 800; border: 4px solid #ffffff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); object-fit: cover; flex-shrink: 0; }
        
        .profile-info { flex: 1; }
        .profile-name { font-size: 2rem; font-weight: 800; color: #1e293b; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        
        /* Badges */
        .badge-verified { background: rgba(16,185,129,0.1); color: #10b981; font-size: 0.8rem; padding: 4px 10px; border-radius: 50px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; border: 1px solid rgba(16,185,129,0.2); }
        .badge-bronze { background: linear-gradient(135deg, #cd7f32, #a0522d); color: white; padding: 4px 10px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #8b4513; }
        .badge-silver { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #0f172a; padding: 4px 10px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #cbd5e1; }
        .badge-gold { background: linear-gradient(135deg, #fcd34d, #f59e0b); color: #78350f; padding: 4px 10px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #d97706; }
        
        .profile-cat { color: #3b82f6; font-weight: 700; display: flex; align-items: center; gap: 5px; margin-bottom: 15px; font-size: 1.1rem; }
        
        .profile-stats { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-item { background: #f8fafc; padding: 8px 15px; border-radius: 12px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 8px; border: 1px solid #f1f5f9; }
        .stat-item i { font-size: 1.2rem; color: #f59e0b; }
        
        .profile-bio { color: #475569; line-height: 1.6; font-size: 0.95rem; }

        .btn-contact { background: #1e293b; color: white; padding: 12px 25px; border-radius: 12px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; flex-shrink: 0; }
        .btn-contact:hover { background: #3b82f6; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59,130,246,0.2); }

        .section-title { font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }

        .gigs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .gig-card { background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 15px; padding: 20px; transition: 0.3s; }
        .gig-card:hover { border-color: #3b82f6; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transform: translateY(-3px); }
        .gig-price { color: #10b981; font-weight: 800; font-size: 1.2rem; margin-bottom: 10px; }
        .gig-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; color: #1e293b; }
        .gig-desc { font-size: 0.9rem; color: #64748b; line-height: 1.5; }

        .review-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .reviewer-name { font-weight: 700; color: #1e293b; }
        .review-date { font-size: 0.8rem; color: #94a3b8; }
        .stars { color: #f59e0b; margin-bottom: 10px; }
        .review-text { color: #475569; font-size: 0.95rem; line-height: 1.5; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .profile-header { flex-direction: column; text-align: center; }
            .profile-stats { justify-content: center; }
        }
    </style>
</head>
<body>

<!-- Header Placeholder (Replaced by layout.js) -->
<div id="header-placeholder"></div>

<section class="profile-section">
    <div class="profile-container" id="profileContent">
        <div style="text-align: center; padding: 100px 0;">
            <i class="ph-bold ph-spinner-gap" style="font-size: 3rem; color: #3b82f6; animation: spin 1s linear infinite;"></i>
            <p style="margin-top: 15px; color: #64748b; font-weight: 600;">Loading professional profile...</p>
        </div>
    </div>
</section>

<!-- Footer Placeholder (Replaced by layout.js) -->
<div id="footer-placeholder"></div>

<script type="module">
    import { supabase } from './js/supabase-client.js';
    import { loadHeader, loadFooter } from './js/layout.js';

    document.addEventListener('DOMContentLoaded', async () => {
        loadHeader();
        loadFooter();

        const urlParams = new URLSearchParams(window.location.search);
        const workerId = urlParams.get('id');

        if (!workerId) {
            document.getElementById('profileContent').innerHTML = '<div style="text-align:center; padding:50px; color:#ef4444; font-weight:bold;">Worker ID is missing.</div>';
            return;
        }

        try {
            // 1. Fetch Worker Details
            const { data: workerData, error: workerErr } = await supabase.from('worker_profiles').select(`
                *,
                users!inner(first_name, last_name, profile_picture),
                categories(name_en, icon_class)
            `).eq('worker_id', workerId).single();

            if (workerErr || !workerData) {
                document.getElementById('profileContent').innerHTML = '<div style="text-align:center; padding:50px; color:#ef4444; font-weight:bold;">Worker not found.</div>';
                return;
            }

            // 2. Fetch Gigs
            const { data: gigs } = await supabase.from('gigs').select('*').eq('worker_id', workerId).eq('status', 'active');

            // 3. Fetch Completed Jobs Count
            const { data: completedJobs } = await supabase.from('jobs').select('id', { count: 'exact' }).eq('assigned_worker_id', workerId).eq('status', 'completed');
            const completedJobsCount = completedJobs ? completedJobs.length : 0;

            // 4. Fetch Reviews
            const { data: reviews, error: reviewErr } = await supabase.from('reviews')
                .select(`
                    id, rating, comment, created_at,
                    reviewer:users!reviews_reviewer_id_fkey(first_name, last_name, profile_picture)
                `)
                .eq('reviewee_id', workerId)
                .order('created_at', { ascending: false });

            // Calculate average rating
            let avgRating = 0;
            if (reviews && reviews.length > 0) {
                const total = reviews.reduce((sum, r) => sum + r.rating, 0);
                avgRating = total / reviews.length;
            }

            renderProfile(workerData, gigs || [], completedJobsCount, workerId, reviews || [], avgRating);

        } catch (err) {
            console.error(err);
            document.getElementById('profileContent').innerHTML = '<div style="text-align:center; padding:50px; color:#ef4444; font-weight:bold;">An error occurred while loading the profile.</div>';
        }
    });

    function getTierBadge(jobsCount, rating) {
        if (jobsCount >= 50 && rating >= 4.5) return '<span class="badge-gold"><i class="ph-fill ph-trophy"></i> Gold Pro</span>';
        if (jobsCount >= 20 && rating >= 4.0) return '<span class="badge-silver"><i class="ph-fill ph-medal"></i> Silver Pro</span>';
        if (jobsCount >= 5) return '<span class="badge-bronze"><i class="ph-fill ph-medal"></i> Bronze Pro</span>';
        return '';
    }

    function renderProfile(worker, gigs, completedJobsCount, workerId, reviews, avgRating) {
        const u = worker.users;
        const c = worker.categories;
        const fullName = `${u.first_name} ${u.last_name || ''}`;
        
        let avatarHtml = `<div class="profile-avatar">${u.first_name.charAt(0)}${(u.last_name||'').charAt(0)}</div>`;
        if (u.profile_picture) {
            avatarHtml = `<img src="${u.profile_picture}" class="profile-avatar" alt="${fullName}">`;
        }

        const tierBadge = getTierBadge(completedJobsCount, avgRating);
        const verifiedBadge = worker.verification_status === 'verified' ? '<span class="badge-verified"><i class="ph-fill ph-shield-check"></i> Verified Identity</span>' : '';

        const iconClass = c?.icon_class || 'ph-squares-four';
        const catName = c?.name_en || 'Service';

        let gigsHtml = '';
        if (gigs.length > 0) {
            gigs.forEach(g => {
                gigsHtml += `
                    <div class="gig-card">
                        <div class="gig-price">Rs. ${parseFloat(g.base_price).toLocaleString(undefined, {minimumFractionDigits:2})}</div>
                        <h3 class="gig-title">${g.title}</h3>
                        <p class="gig-desc">${g.description || ''}</p>
                    </div>
                `;
            });
        } else {
            gigsHtml = '<p style="color: #64748b; padding: 20px 0; grid-column: 1/-1;">This professional hasn\'t listed specific services yet.</p>';
        }

        document.getElementById('profileContent').innerHTML = `
            <div class="profile-header">
                ${avatarHtml}
                
                <div class="profile-info">
                    <h1 class="profile-name">${fullName}</h1>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
                        ${tierBadge}
                        ${verifiedBadge}
                    </div>

                    <div class="profile-cat">
                        <i class="ph-fill ${iconClass}"></i> ${catName} Professional
                    </div>
                    
                    <div class="profile-stats">
                        <span class="stat-item"><i class="ph-fill ph-star"></i> ${avgRating.toFixed(1)} / 5.0 (${reviews.length} Reviews)</span>
                        <span class="stat-item"><i class="ph-fill ph-check-circle" style="color:#10b981;"></i> ${completedJobsCount} Jobs Completed</span>
                    </div>
                    
                    <p class="profile-bio">${worker.bio ? worker.bio.replace(/\\n/g, '<br>') : 'No bio provided.'}</p>
                </div>

                <a href="chat.html" class="btn-contact"><i class="ph-bold ph-chat-teardrop-dots"></i> Message Worker</a>
            </div>

            <h2 class="section-title"><i class="ph-fill ph-briefcase" style="color: #3b82f6;"></i> Offered Services</h2>
            <div class="gigs-grid">
                ${gigsHtml}
            </div>

            <h2 class="section-title"><i class="ph-fill ph-star" style="color: #f59e0b;"></i> Client Reviews</h2>
            <div class="reviews-list">
                ${reviews.length > 0 ? reviews.map(r => `
                    <div class="review-card">
                        <div class="review-header">
                            <span class="reviewer-name">${r.reviewer.first_name} ${r.reviewer.last_name}</span>
                            <span class="review-date">${new Date(r.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</span>
                        </div>
                        <div class="stars">
                            ${Array(5).fill(0).map((_, i) => `<i class="${i < r.rating ? 'ph-fill' : 'ph'} ph-star"></i>`).join('')}
                        </div>
                        <p class="review-text">${r.comment}</p>
                    </div>
                `).join('') : '<p style="color: #64748b; padding: 20px 0;">No reviews available yet.</p>'}
            </div>
        `;
    }
</script>

<style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

</body>
</html>
