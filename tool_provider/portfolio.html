<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Provider Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .dash-section { padding: 40px 5%; min-height: 85vh; position: relative; background: #fdfbf7; }
        .dash-container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 10; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; display: flex; align-items: center; gap: 10px; }
        .btn-back { background: #e5e7eb; color: #374151; padding: 10px 20px; border-radius: 50px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-back:hover { background: #d1d5db; color: #111827; }

        .portfolio-upload-area { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border: 2px dashed #cbd5e1; border-radius: 30px; padding: 40px; text-align: center; margin-bottom: 40px; transition: 0.3s; cursor: pointer; position: relative; }
        .portfolio-upload-area:hover { border-color: #3b82f6; background: rgba(255, 255, 255, 0.95); }
        .upload-icon { font-size: 3.5rem; color: #9ca3af; margin-bottom: 10px; transition: 0.3s; }
        .portfolio-upload-area:hover .upload-icon { color: #3b82f6; transform: translateY(-5px); }
        .upload-text { font-size: 1.2rem; font-weight: 800; color: #1a1a1a; margin-bottom: 5px; }
        .upload-subtext { color: #64748b; font-size: 0.95rem; }

        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .portfolio-item { border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.08); background: #fff; border: 1px solid rgba(255,255,255,0.8); height: 250px; }
        .portfolio-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .portfolio-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%); opacity: 0; transition: 0.3s; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .portfolio-item:hover img { transform: scale(1.05); }
        .portfolio-item:hover .portfolio-overlay { opacity: 1; }
        .item-title { color: white; font-size: 1.1rem; font-weight: 700; margin-bottom: 5px; }
        
        .btn-delete { position: absolute; top: 15px; right: 15px; background: rgba(239, 68, 68, 0.9); color: white; width: 35px; height: 35px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 1.1rem; backdrop-filter: blur(5px); opacity: 0; }
        .portfolio-item:hover .btn-delete { opacity: 1; }
        .btn-delete:hover { background: #dc2626; transform: scale(1.1); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: #ffffff; width: 100%; max-width: 500px; border-radius: 30px; padding: 35px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); transform: translateY(30px) scale(0.95); transition: 0.4s; position: relative; }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
        .close-btn { position: absolute; top: 25px; right: 25px; font-size: 1.5rem; color: #a3a3a3; cursor: pointer; transition: 0.3s; border: none; background: transparent; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; color: #1a1a1a; }
        .form-control { width: 100%; padding: 15px 20px; border-radius: 15px; border: 2px solid #e5dfd5; background: #f8fafc; font-size: 1rem; transition: 0.3s; outline: none; font-weight: 500; font-family: inherit; }
        .form-control:focus { border-color: #3b82f6; background: #ffffff; }

        .btn-primary { background: #3b82f6; color: white; padding: 15px 25px; border-radius: 50px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; box-shadow: 0 10px 20px rgba(59,130,246,0.2); transition: 0.3s; width: 100%; justify-content: center;}
        .btn-primary:hover { background: #2563eb; transform: translateY(-3px); box-shadow: 0 15px 25px rgba(59,130,246,0.3); }

        .preview-img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<section class="dash-section">
    <div class="dash-container">
        
        <div class="page-header">
            <h1><i class="ph-fill ph-images" style="color: #3b82f6;"></i> My Portfolio</h1>
            <a href="dashboard.html" class="btn-back"><i class="ph-bold ph-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="portfolio-upload-area" onclick="openModal('uploadModal')">
            <i class="ph-duotone ph-upload-simple upload-icon"></i>
            <div class="upload-text">Upload New Project Photo</div>
            <div class="upload-subtext">Showcase your best past work to attract more clients. (JPEG/PNG up to 5MB)</div>
        </div>

        <div id="portfolioContainer" class="portfolio-grid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 50px; background: rgba(255,255,255,0.5); border-radius: 20px; color: #64748b; font-size: 1.1rem;">
                <i class="ph-duotone ph-spinner-gap ph-spin" style="font-size: 2rem;"></i> Loading your portfolio...
            </div>
        </div>

    </div>
</section>

<!-- Upload Modal -->
<div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
        <button class="close-btn" onclick="closeModal('uploadModal')"><i class="ph-bold ph-x"></i></button>
        <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 20px;"><i class="ph-fill ph-image" style="color: #3b82f6;"></i> Add to Portfolio</h2>
        <form id="portfolioForm">
            <img id="imagePreview" class="preview-img" src="" alt="Preview">
            <div class="form-group">
                <label>Select Image File *</label>
                <input type="file" id="portfolioImage" class="form-control" accept="image/png, image/jpeg, image/webp" required style="padding: 12px 20px;" onchange="previewFile()">
            </div>
            <div class="form-group">
                <label>Project Title / Description (Optional)</label>
                <input type="text" id="portfolioTitle" class="form-control" placeholder="e.g. Modern Bathroom Renovation">
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">
                <i class="ph-bold ph-upload-simple"></i> Upload & Save
            </button>
        </form>
    </div>
</div>

<script type="module">
    import { supabase } from '../js/supabase-client.js';

    let currentUserId = null;

    window.openModal = function(modalId) { 
        document.getElementById(modalId).classList.add('active'); 
        document.body.style.overflow = 'hidden'; 
    };
    window.closeModal = function(modalId) { 
        document.getElementById(modalId).classList.remove('active'); 
        document.body.style.overflow = 'auto'; 
        if (modalId === 'uploadModal') {
            document.getElementById('portfolioForm').reset();
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('imagePreview').src = '';
        }
    };
    window.onclick = function(e) { if(e.target.classList.contains('modal-overlay')) window.closeModal(e.target.id); };

    window.previewFile = function() {
        const file = document.getElementById('portfolioImage').files[0];
        const preview = document.getElementById('imagePreview');
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        }
    };

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: userProfile } = await supabase.from('users').select('*').eq('auth_id', session.user.id).single();
        if (!userProfile) { window.location.href = '../login.html'; return; }
        
        currentUserId = userProfile.id;
        
        await loadPortfolio();

        document.getElementById('portfolioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="ph-duotone ph-spinner-gap ph-spin"></i> Uploading...'; 
            btn.disabled = true;

            const title = document.getElementById('portfolioTitle').value;
            const fileInput = document.getElementById('portfolioImage');
            
            if (fileInput.files.length === 0) {
                Swal.fire('Error', 'Please select an image', 'error');
                btn.innerHTML = ogText; btn.disabled = false;
                return;
            }

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUserId}-${Date.now()}.${fileExt}`;
            
            // Upload to Supabase Storage bucket 'portfolios'
            const { data: uploadData, error: uploadError } = await supabase.storage.from('portfolios').upload(fileName, file);
            
            if (uploadError) {
                Swal.fire('Upload Error', uploadError.message, 'error');
                btn.innerHTML = ogText; btn.disabled = false;
                return;
            }
            
            const { data: { publicUrl } } = supabase.storage.from('portfolios').getPublicUrl(fileName);

            // Save to DB
            const payload = {
                worker_id: currentUserId,
                title: title,
                image_path: publicUrl
            };

            const { error } = await supabase.from('portfolios').insert([payload]);
            if (error) {
                Swal.fire('Error', error.message, 'error');
            } else {
                Swal.fire('Uploaded!', 'Image added to your portfolio.', 'success');
                closeModal('uploadModal');
                loadPortfolio();
            }

            btn.innerHTML = ogText; btn.disabled = false;
        });
    });

    async function loadPortfolio() {
        const { data: items, error } = await supabase.from('portfolios').select('*').eq('worker_id', currentUserId).order('created_at', { ascending: false });
        
        const container = document.getElementById('portfolioContainer');
        if (error) {
            container.innerHTML = `<div style="grid-column: 1 / -1; color: red;">Failed to load portfolio.</div>`;
            return;
        }

        if (items.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; background: rgba(255,255,255,0.5); border-radius: 20px;">
                    <div style="width: 80px; height: 80px; background: #f0fdf4; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 20px;">
                        <i class="ph-duotone ph-image"></i>
                    </div>
                    <h3 style="font-size: 1.4rem; font-weight: 800; color: #1a1a1a; margin-bottom: 10px;">Your portfolio is empty</h3>
                    <p style="color: #64748b;">Upload photos of your previous work to build trust with clients.</p>
                </div>
            `;
            return;
        }

        let html = '';
        items.forEach(item => {
            html += `
                <div class="portfolio-item">
                    <img src="${item.image_path}" alt="Portfolio Image">
                    <div class="portfolio-overlay">
                        <div class="item-title">${item.title || 'Portfolio Project'}</div>
                        <div style="color: rgba(255,255,255,0.7); font-size: 0.8rem;"><i class="ph-fill ph-calendar"></i> ${new Date(item.created_at).toLocaleDateString()}</div>
                    </div>
                    <button class="btn-delete" onclick="window.deletePortfolio(${item.id})" title="Delete Image"><i class="ph-bold ph-trash"></i></button>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }

    window.deletePortfolio = async function(id) {
        if(confirm('Are you sure you want to delete this portfolio item?')) {
            const { error } = await supabase.from('portfolios').delete().eq('id', id);
            if(error) Swal.fire('Error', 'Failed to delete item.', 'error');
            else loadPortfolio();
        }
    };
</script>

</body>
</html>
