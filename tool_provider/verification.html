<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification - Provider Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .dash-section { padding: 40px 5%; min-height: 85vh; position: relative; background: #fdfbf7; display: flex; align-items: center; justify-content: center; }
        .dash-container { max-width: 650px; width: 100%; position: relative; z-index: 10; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-header h1 { font-size: 2rem; font-weight: 800; color: #1a1a1a; display: flex; align-items: center; gap: 10px; }
        .btn-back { background: #e5e7eb; color: #374151; padding: 10px 20px; border-radius: 50px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-back:hover { background: #d1d5db; color: #111827; }

        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 20px 50px rgba(0,0,0,0.06); padding: 40px; border-radius: 30px; }
        
        .status-banner { padding: 20px; border-radius: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 30px; font-weight: 700; }
        .status-banner.pending { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .status-banner.verified { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-banner.rejected { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .status-banner.unsubmitted { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

        .status-icon { font-size: 2rem; }

        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; color: #1a1a1a; }
        
        .file-upload-box { border: 2px dashed #cbd5e1; border-radius: 15px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #f8fafc; position: relative; overflow: hidden; }
        .file-upload-box:hover { border-color: #3b82f6; background: #eff6ff; }
        .file-upload-box.has-file { border: 2px solid #10b981; background: #ecfdf5; }
        
        .file-upload-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .upload-icon { font-size: 2.5rem; color: #9ca3af; margin-bottom: 10px; transition: 0.3s; }
        .file-upload-box:hover .upload-icon { color: #3b82f6; transform: translateY(-3px); }
        .file-upload-box.has-file .upload-icon { color: #10b981; }
        
        .upload-text { font-size: 1rem; font-weight: 700; color: #374151; margin-bottom: 5px; }
        .upload-subtext { font-size: 0.85rem; color: #64748b; }
        
        .preview-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; display: none; margin-top: 15px; border: 1px solid #e2e8f0; }

        .btn-primary { background: #3b82f6; color: white; padding: 18px 25px; border-radius: 50px; font-weight: 800; text-decoration: none; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(59,130,246,0.2); transition: 0.3s; width: 100%; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-3px); box-shadow: 0 15px 30px rgba(59,130,246,0.3); }
        .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>

<section class="dash-section">
    <div class="dash-container">
        
        <div class="page-header">
            <h1><i class="ph-fill ph-shield-check" style="color: #10b981;"></i> Identity Verification</h1>
            <a href="dashboard.html" class="btn-back"><i class="ph-bold ph-arrow-left"></i> Dashboard</a>
        </div>

        <div class="glass-card glass-premium">
            
            <div id="statusBanner" class="status-banner unsubmitted">
                <i class="ph-fill ph-info status-icon" id="statusIcon"></i>
                <div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 2px;" id="statusTitle">Verification Not Submitted</h3>
                    <p style="font-size: 0.9rem; font-weight: 500;" id="statusDesc">Please upload your NIC documents to get verified.</p>
                </div>
            </div>

            <form id="verificationForm">
                <div class="form-group">
                    <label>National Identity Card (NIC) Front Side *</label>
                    <div class="file-upload-box" id="frontBox">
                        <input type="file" id="nicFront" class="file-upload-input" accept="image/jpeg, image/png, image/webp" onchange="previewFile(this, 'frontPreview', 'frontBox')">
                        <i class="ph-duotone ph-upload-simple upload-icon"></i>
                        <div class="upload-text" id="frontText">Click or drag to upload Front Side</div>
                        <div class="upload-subtext">JPEG, PNG up to 5MB</div>
                        <img id="frontPreview" class="preview-img" src="" alt="Front Preview">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>National Identity Card (NIC) Back Side *</label>
                    <div class="file-upload-box" id="backBox">
                        <input type="file" id="nicBack" class="file-upload-input" accept="image/jpeg, image/png, image/webp" onchange="previewFile(this, 'backPreview', 'backBox')">
                        <i class="ph-duotone ph-upload-simple upload-icon"></i>
                        <div class="upload-text" id="backText">Click or drag to upload Back Side</div>
                        <div class="upload-subtext">JPEG, PNG up to 5MB</div>
                        <img id="backPreview" class="preview-img" src="" alt="Back Preview">
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <i class="ph-bold ph-paper-plane-right"></i> Submit Documents
                </button>
            </form>
            
        </div>
    </div>
</section>

<script type="module">
    import { supabase } from '../js/supabase-client.js';

    let currentUserId = null;

    window.previewFile = function(input, previewId, boxId) {
        const file = input.files[0];
        const preview = document.getElementById(previewId);
        const box = document.getElementById(boxId);
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            box.classList.add('has-file');
            
            // hide icon and text
            box.querySelector('.upload-icon').style.display = 'none';
            box.querySelector('.upload-text').style.display = 'none';
            box.querySelector('.upload-subtext').style.display = 'none';
        }
    };

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: userProfile } = await supabase.from('users').select('*').eq('auth_id', session.user.id).single();
        if (!userProfile) { window.location.href = '../login.html'; return; }
        
        currentUserId = userProfile.id;
        
        await loadVerificationStatus();

        document.getElementById('verificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="ph-duotone ph-spinner-gap ph-spin"></i> Uploading...'; 
            btn.disabled = true;

            const frontInput = document.getElementById('nicFront');
            const backInput = document.getElementById('nicBack');
            
            if (frontInput.files.length === 0 || backInput.files.length === 0) {
                Swal.fire('Error', 'Please upload both front and back sides of your NIC.', 'error');
                btn.innerHTML = ogText; btn.disabled = false;
                return;
            }

            const frontFile = frontInput.files[0];
            const backFile = backInput.files[0];
            
            try {
                // Upload Front
                const frontExt = frontFile.name.split('.').pop();
                const frontName = `${currentUserId}-front-${Date.now()}.${frontExt}`;
                const { error: fErr } = await supabase.storage.from('verifications').upload(frontName, frontFile);
                if (fErr) throw fErr;
                const { data: { publicUrl: frontUrl } } = supabase.storage.from('verifications').getPublicUrl(frontName);

                // Upload Back
                const backExt = backFile.name.split('.').pop();
                const backName = `${currentUserId}-back-${Date.now()}.${backExt}`;
                const { error: bErr } = await supabase.storage.from('verifications').upload(backName, backFile);
                if (bErr) throw bErr;
                const { data: { publicUrl: backUrl } } = supabase.storage.from('verifications').getPublicUrl(backName);

                // Update DB
                const { error: dbErr } = await supabase.from('worker_profiles').update({
                    nic_front: frontUrl,
                    nic_back: backUrl,
                    verification_status: 'pending'
                }).eq('worker_id', currentUserId);

                if (dbErr) throw dbErr;

                Swal.fire('Submitted!', 'Your documents have been submitted for review.', 'success').then(() => {
                    location.reload();
                });

            } catch (error) {
                Swal.fire('Upload Failed', error.message, 'error');
                btn.innerHTML = ogText; btn.disabled = false;
            }
        });
    });

    async function loadVerificationStatus() {
        const { data: wp, error } = await supabase.from('worker_profiles').select('*').eq('worker_id', currentUserId).single();
        
        const banner = document.getElementById('statusBanner');
        const icon = document.getElementById('statusIcon');
        const title = document.getElementById('statusTitle');
        const desc = document.getElementById('statusDesc');
        const form = document.getElementById('verificationForm');
        
        if (wp) {
            banner.className = 'status-banner'; // reset
            if (wp.verification_status === 'pending') {
                banner.classList.add('pending');
                icon.className = 'ph-fill ph-clock status-icon';
                title.innerText = 'Verification Pending';
                desc.innerText = 'We are reviewing your documents. This usually takes 1-2 business days.';
                form.style.display = 'none';
            } else if (wp.verification_status === 'verified') {
                banner.classList.add('verified');
                icon.className = 'ph-fill ph-seal-check status-icon';
                title.innerText = 'Account Verified';
                desc.innerText = 'Your identity has been verified successfully. You can now use all platform features.';
                form.style.display = 'none';
            } else if (wp.verification_status === 'rejected') {
                banner.classList.add('rejected');
                icon.className = 'ph-fill ph-warning-circle status-icon';
                title.innerText = 'Verification Rejected';
                desc.innerText = 'Your documents were rejected. Please make sure images are clear and resubmit.';
            } else {
                banner.classList.add('unsubmitted');
                icon.className = 'ph-fill ph-info status-icon';
                title.innerText = 'Verification Not Submitted';
                desc.innerText = 'Please upload your NIC documents to get verified.';
            }
        }
    }
</script>

</body>
</html>
