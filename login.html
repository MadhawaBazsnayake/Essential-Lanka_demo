<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Essential Lanka</title>
    <meta name="theme-color" content="#10b981">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.min.css">
    <link rel="stylesheet" href="assets/css/pill-alerts.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .auth-section { padding: 80px 5%; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #fdfbf7; }
        .auth-container { width: 100%; max-width: 480px; position: relative; z-index: 10; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(30px); }
        
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .ios-glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05); padding: 50px 40px; border-radius: 36px; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .ios-glass-card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0,0,0,0.08); }
        
        .form-group { margin-bottom: 25px; text-align: left; position: relative; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 0.9rem; color: #374151; letter-spacing: 0.5px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 18px 24px; border-radius: 20px; border: 2px solid #f3f4f6; background: #f9fafb; font-size: 1rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); outline: none; font-weight: 500; color: #1f2937; box-sizing: border-box; }
        .form-control:focus { border-color: #10b981; background: #ffffff; box-shadow: 0 0 0 4px rgba(16,185,129,0.15); transform: translateY(-2px); }
        
        .btn-submit { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 20px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; font-size: 1.15rem; box-shadow: 0 12px 24px rgba(16,185,129,0.25); margin-top: 15px; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-submit:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(16,185,129,0.35); }
        .btn-submit:active { transform: translateY(0); }
        
        .blob-bg-auth { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); width: 700px; height: 700px; background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, rgba(244,238,227,0) 70%); border-radius: 50%; z-index: 1; filter: blur(40px); animation: pulse 6s infinite alternate; }
        .blob-bg-auth-2 { position: absolute; bottom: -10%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, rgba(244,238,227,0) 70%); border-radius: 50%; z-index: 1; filter: blur(40px); animation: pulse 8s infinite alternate-reverse; }
        
        @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.1); } }
        @keyframes pulse2 { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        
        .forgot-link { float: right; color: #10b981; font-weight: 700; font-size: 0.95rem; text-decoration: none; margin-top: -15px; margin-bottom: 25px; display: inline-block; transition: all 0.3s; }
        .forgot-link:hover { color: #059669; text-decoration: underline; }

        .icon-header { width: 80px; height: 80px; background: rgba(16, 185, 129, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #10b981; font-size: 2.5rem; transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .ios-glass-card:hover .icon-header { transform: scale(1.1) rotate(5deg); }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .back-home { position: absolute; top: 30px; left: 30px; z-index: 20; color: #374151; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 1rem; transition: color 0.3s; }
        .back-home:hover { color: #10b981; }

        @media (max-width: 768px) {
            .ios-glass-card { padding: 40px 25px; border-radius: 28px; }
            .auth-section { padding: 40px 5%; }
            .blob-bg-auth { width: 400px; height: 400px; }
        }
    </style>
</head>
<body>

<a href="index.html" class="back-home"><i class="ph-bold ph-arrow-left"></i> Home</a>

<section class="auth-section">
    <div class="blob-bg-auth"></div>
    <div class="blob-bg-auth-2" style="animation: pulse2 8s infinite alternate-reverse;"></div>
    
    <div class="auth-container">
        <div class="ios-glass-card glass-premium text-center">
            
            <div class="icon-header">
                <i class="ph-fill ph-user-circle"></i>
            </div>
            
            <h2 style="font-weight: 800; font-size: 2.4rem; margin-bottom: 8px; color: #111827; letter-spacing: -0.5px;">Welcome Back</h2>
            <p style="color: #6b7280; margin-bottom: 40px; font-size: 1.15rem;">Please enter your details to sign in.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <div style="text-align: right; width: 100%;">
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="btnText">Sign In</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
                
                <p style="margin-top: 30px; color: #6b7280; font-size: 1.05rem; font-weight: 500;">
                    Don't have an account? <a href="register.html" style="color: #10b981; font-weight: 800; text-decoration: none; border-bottom: 2px solid transparent; transition: 0.3s;" onmouseover="this.style.borderBottom='2px solid #10b981'" onmouseout="this.style.borderBottom='2px solid transparent'">Sign Up</a>
                </p>
            </form>

        </div>
    </div>
</section>

<script type="module">
    import { loginUser } from './js/auth.js';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const submitBtn = document.getElementById('submitBtn');

        // UI Loading state
        submitBtn.disabled = true;
        btnText.style.display = 'none';
        btnSpinner.style.display = 'block';

        await loginUser(email, password);

        // Reset UI state
        submitBtn.disabled = false;
        btnText.style.display = 'block';
        btnSpinner.style.display = 'none';
    });
</script>

</body>
</html>
